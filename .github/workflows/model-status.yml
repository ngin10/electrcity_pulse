name: Model status

# Optional: publishes the model-status page (charts, badges, monitoring, retraining gate, registry) to GitHub Pages,
# read-only against Databricks. Manual only: by default the snapshot in docs/status is refreshed from a local
# machine (python databricks/tools/model_status.py --out docs/status), so no Databricks credential lives in GitHub.
# To run it here instead, add a schedule trigger back (e.g. cron '30 19 * * *', after the 18:45 UTC scoring job).
#
# Setup, only if you use this workflow:
#   Settings -> Secrets and variables -> Actions:
#     secrets   DATABRICKS_HOST (https://<workspace>.cloud.databricks.com), DATABRICKS_TOKEN (a personal access token)
#     variable  DATABRICKS_WAREHOUSE_ID (optional; defaults to the project's warehouse below)
#   Settings -> Pages -> Source: GitHub Actions

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: databricks/tools/status_requirements.txt
      - run: pip install -r databricks/tools/status_requirements.txt
      # The credentials reach only this step, not pip install or the actions
      - run: python databricks/tools/model_status.py --out site
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          # Not a secret (useless without the token); a repository variable overrides it
          DATABRICKS_WAREHOUSE_ID: ${{ vars.DATABRICKS_WAREHOUSE_ID || 'f521e4748e25cc96' }}
          MLFLOW_DISABLE_AGENT_HINT: '1'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
