# The three pipelines: one per layer, so each can fail, refresh and be full-refreshed on its own.
# A full refresh of silver or gold rebuilds it from the layer below; bronze is never touched by either.
resources:
  pipelines:
    pulse_bronze:
      name: pulse_bronze
      catalog: ${var.catalog}
      schema: bronze
      serverless: true
      continuous: false      # triggered: load what is new, then stop
      channel: CURRENT
      configuration:
        pulse.src_path: ${workspace.file_path}/src
        pulse.catalog: ${var.catalog}
        pulse.landing: ${var.landing_path}
        spark.sql.session.timeZone: UTC
      libraries:
        - file:
            path: ../src/pipelines/bronze.py

    pulse_silver:
      name: pulse_silver
      catalog: ${var.catalog}
      schema: silver
      serverless: true
      continuous: false
      channel: CURRENT
      configuration:
        pulse.src_path: ${workspace.file_path}/src
        pulse.catalog: ${var.catalog}
        spark.sql.session.timeZone: UTC
      libraries:
        - file:
            path: ../src/pipelines/silver.py

    pulse_gold:
      name: pulse_gold
      catalog: ${var.catalog}
      schema: gold
      serverless: true
      continuous: false
      channel: CURRENT
      configuration:
        pulse.src_path: ${workspace.file_path}/src
        pulse.catalog: ${var.catalog}
        spark.sql.session.timeZone: UTC
      libraries:
        - file:
            path: ../src/pipelines/gold.py
