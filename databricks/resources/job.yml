# The daily run: bronze -> silver -> gold -> health, after the ingestion code has landed the day's files
# (and, on Free Edition, after tools/sync_landing.py has copied them into the volume).
resources:
  jobs:
    pulse_daily:
      name: pulse_daily
      schedule:
        # 07:00 UK time, all year round (Quartz cron: sec min hour day-of-month month day-of-week)
        quartz_cron_expression: "0 0 7 * * ?"
        timezone_id: Europe/London
      max_concurrent_runs: 1
      tasks:
        - task_key: bronze
          pipeline_task:
            pipeline_id: ${resources.pipelines.pulse_bronze.id}
          # A new landing column stops the first update once (Auto Loader records it); the retry picks it up
          max_retries: 1
          min_retry_interval_millis: 60000

        - task_key: silver
          depends_on:
            - task_key: bronze
          pipeline_task:
            pipeline_id: ${resources.pipelines.pulse_silver.id}

        - task_key: gold
          depends_on:
            - task_key: silver
          pipeline_task:
            pipeline_id: ${resources.pipelines.pulse_gold.id}

        - task_key: health
          depends_on:
            - task_key: gold
          notebook_task:
            notebook_path: ../src/notebooks/pipeline_health.py
            base_parameters:
              catalog: ${var.catalog}
              landing_path: ${var.landing_path}
